name: prepare-android-build
description: Action to prepare environment for android build

inputs:
  sign:
    description: Flag to enable android package signing
    default: "true"

runs:
  using: composite
  steps:
    - name: ci/prepare-mobile-build
      uses: ./.github/actions/prepare-mobile-build

    - name: ci/setup-java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: ci/build-react-native-gradle-plugin
      shell: bash
      run: |
        echo "::group::Build React Native Gradle Plugin"
        cd node_modules/@react-native/gradle-plugin
        ./gradlew :settings-plugin:build :react-native-gradle-plugin:build --no-daemon
        echo "::endgroup::"

    - name: ci/apply-16kb-pagesize-patch
      shell: bash
      run: |
        echo "::group::Apply 16KB page size compatibility patch"
        npm run apply-16kb-pagesize-patch
        echo "::endgroup::"

    - name: ci/jetify-android-libraries
      shell: bash
      run: |
        echo "::group::jetify-android-libraries"
        ./node_modules/.bin/jetify
        echo "::endgroup::"

    - name: ci/use-keystore-from-repo
      if: ${{ inputs.sign == 'true' }}
      shell: bash
      run: |
        echo "::group::Use keystore from repository"
        # keystore.properties and optibot-release.keystore are already in the repo
        # build.gradle will read keystore.properties automatically
        echo "Using keystore from repository: android/app/optibot-release.keystore"
        echo "keystore.properties is already present"
        echo "::endgroup::"
